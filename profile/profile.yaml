# List of Jarvis projects
jarvis_projects:
  - name: "Cluster Monitor"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Developed a Linux Cluster Monitoring Agent for the Jarvis LCA team to support resource planning in a Rocky Linux cluster. The agent uses Bash scripts to collect both static host information, such as hostname, CPU, memory, and architecture, and real-time usage metrics, such as CPU and memory usage. The data is inserted into PostgreSQL, allowing users to run SQL queries for usage analysis and capacity planning. PostgreSQL was provisioned with Docker, while cron scheduled the usage script to run automatically at regular intervals. I manually tested the scripts, verified database inserts, and managed the source code with Git and GitHub."
  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Developed a Python Data Analytics project to analyze an online retail dataset from London Gift Shop and extract business insights from customer transactions. The project loads retail data from PostgreSQL into a pandas DataFrame, then performs data wrangling steps such as handling missing values, creating invoice-level metrics, calculating monthly revenue, identifying placed and canceled orders, and separating new versus existing customers. I used pandas and NumPy for data transformation and Matplotlib to visualize trends such as monthly sales, order patterns, and customer behavior. The analysis results help understand revenue changes, customer growth, and purchasing patterns over time."

# List of personal or academic projects
# Feel free to add more projects
highlighted_projects:
    #project name
  - name: "Stock Prices Prediction via LLM"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "Implemented a stock price prediction project using Reuters news data to support research and backtesting, implemented a scalable ETL pipeline for 10M+ new records and standardized JSON-to-tabular ingestion while operationalizing Llama2-13B embeddings as sentiment and feature inputs for downstream ML models, evaluated performance with log loss, accuracy, and return-based metrics, and improved predictive stability and estimated strategy ROI through feature and threshold tuning."
  - name: "Text2SQL system with RAG"
    git_url: "https://github.com/Nus0202/Text2SQL_with_RAG"
    description: "Developed a RAG-based Text2SQL system for complex query generation, using DeepSeek-R1:8B, SentenceTransformers, and FAISS to retrieve relevant schema context and improve prompt grounding for multi-table and nested SQL tasks, tested the system on the Spider benchmark and analyzed error patterns with Ridge Regression bias-variance decomposition, resulting in an accuracy gain from 16% to 72% and clearer insight into underfitting on smaller schemas."
  - name: "Phishing Email Detector"
    git_url: "https://github.com/Nus0202/BERT_phishing_email_detector"
    description: "Built a phishing email detection system for multi-domain email datasets, implemented a fine-tuned BERT model with stratified sampling, distributed training, and dynamic learning-rate scheduling to improve training efficiency and maintain robustness, tested performance across datasets including SpamAssassin, Enron, and Kaggle, and delivered a Streamlit dashboard for risk and compliance teams to inspect model decisions, monitor false positives, and simulate email threat scenarios in real time."

